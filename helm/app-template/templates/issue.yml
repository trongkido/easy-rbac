{{- if and .Values.ingress.enabled .Values.ingress.certmanager.enabled -}}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.ingress.certmanager.issuename }}
  namespace: {{ .Release.Namespace }}
spec:
  acme:
    server: {{ .Values.ingress.certmanager.issueacme }}
    privateKeySecretRef:
      name: {{ .Values.ingress.certmanager.issuename }}
    solvers:
    - http01:
        ingress:
          class: nginx
{{- end }}
